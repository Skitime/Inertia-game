<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101c">
  <title>INERTIA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">◆</div>
      <div>
        <h1>INERTIA</h1>
        <p>SHIFT GRAVITY. SOLVE THE BOARD.</p>
      </div>
    </header>

    <section class="card level-card">
      <div class="eyebrow">BUILD 0.3</div>
      <h2 id="level-title">Puzzle 1</h2>
      <div id="lesson" class="lesson"></div>
    </section>

    <section class="stats">
      <div class="card stat"><span>PUZZLE</span><strong id="level-number">1/4</strong></div>
      <div class="card stat"><span>MOVES</span><strong id="move-count">0</strong></div>
      <div class="card stat"><span>PAR</span><strong id="par-count">1</strong></div>
    </section>

    <section class="card board-card">
      <div id="board" class="board" aria-label="Game board"></div>
      <div id="message" class="message">Tap a direction to move every cube.</div>
    </section>

    <section class="gravity-controls" aria-label="Gravity controls">
      <span></span>
      <button data-dir="U" aria-label="Move up">↑</button>
      <span></span>
      <button data-dir="L" aria-label="Move left">←</button>
      <button data-dir="D" aria-label="Move down">↓</button>
      <button data-dir="R" aria-label="Move right">→</button>
    </section>

    <section class="utility-controls">
      <button id="undo">↶ Undo</button>
      <button id="restart">↻ Restart</button>
    </section>

    <section id="win-panel" class="card win-panel" hidden>
      <h2>Solved</h2>
      <div class="score"><span id="final-moves">0</span> moves</div>
      <p id="score-message"></p>
      <button id="next-level">Next Puzzle →</button>
    </section>

    <section class="card instructions">
      <h3>HOW TO PLAY</h3>
      <p>Choose a direction. Every cube slides until something stops it.</p>
      <p>Land every cube on a gold goal. Cubes can stop other cubes.</p>
    </section>

    <footer>INERTIA Build 0.3</footer>
  </main>

  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
